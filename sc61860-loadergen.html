<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC61860 Loader Generator — BIN → BASIC POKE Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0c10;
    --panel:    #0f1319;
    --border:   #1e2d3d;
    --accent:   #00e5ff;
    --accent2:  #ff6b35;
    --green:    #39ff14;
    --purple:   #c792ea;
    --dim:      #3a4a5a;
    --text:     #c8d8e8;
    --muted:    #5a7a8a;
    --addr:     #ff6b35;
    --hex:      #00e5ff;
    --ascii:    #c8d8e8;
    --error:    #ff4444;
    --glow:     0 0 8px rgba(0,229,255,0.4);
    --glow2:    0 0 8px rgba(57,255,20,0.3);
    --glow3:    0 0 8px rgba(199,146,234,0.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  header {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(180deg, rgba(0,229,255,0.04) 0%, transparent 100%);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity: 0.45;
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900; font-size: 20px;
    color: var(--accent); text-shadow: var(--glow);
    letter-spacing: 2px; white-space: nowrap; text-decoration: none;
  }
  .logo span { color: var(--accent2); text-shadow: 0 0 8px rgba(255,107,53,0.5); }
  .tagline { color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .nav-back {
    font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700;
    color: var(--muted); text-decoration: none; letter-spacing: 1px;
    border: 1px solid var(--dim); padding: 5px 12px; border-radius: 2px;
    transition: all 0.2s;
  }
  .nav-back:hover { color: var(--accent); border-color: var(--accent); }
  .badge {
    margin-left: auto; font-size: 11px; color: var(--muted);
    text-align: right; line-height: 1.6;
  }
  .badge em { color: var(--accent2); font-style: normal; }

  /* ── CONTROLS ── */
  .controls {
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 9px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    row-gap: 7px;
  }

  label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .btn {
    font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; padding: 0 15px; border: 1px solid currentColor;
    background: transparent; cursor: pointer; border-radius: 2px;
    transition: all 0.2s; text-transform: uppercase; white-space: nowrap;
    height: 28px; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary   { color: var(--accent); border-color: var(--accent); }
  .btn-primary:hover  { background: rgba(0,229,255,0.1); box-shadow: var(--glow); }
  .btn-orange    { color: var(--accent2); border-color: var(--accent2); }
  .btn-orange:hover   { background: rgba(255,107,53,0.1); box-shadow: 0 0 8px rgba(255,107,53,0.4); }
  .btn-green     { color: var(--green); border-color: var(--green); }
  .btn-green:hover    { background: rgba(57,255,20,0.08); box-shadow: var(--glow2); }
  .btn-secondary { color: var(--muted); border-color: var(--dim); }
  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  .sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

  .fieldset { display: grid; gap: 6px; }
  .small-input {
    padding: 7px 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace;
    font-size: 12px; border-radius: 2px; outline: none;
  }
  select.small-input { width: 108px; }
  .hint { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* toggle */
  .toggle-group { display: flex; align-items: center; gap: 7px; }
  .toggle-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .toggle-wrap {
    position: relative; display: flex; align-items: stretch;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden; cursor: pointer;
    user-select: none; height: 28px;
  }
  .toggle-opt {
    padding: 0 14px; display: flex; align-items: center;
    font-family: 'Orbitron', monospace; font-size: 10px;
    font-weight: 700; letter-spacing: 1px; color: var(--muted);
    transition: color 0.18s; position: relative; z-index: 1; white-space: nowrap;
  }
  .toggle-slider {
    position: absolute; top: 2px; bottom: 2px; border-radius: 1px;
    background: rgba(57,255,20,0.12); border: 1px solid rgba(57,255,20,0.55);
    transition: left 0.16s cubic-bezier(.4,0,.2,1), width 0.16s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
  .toggle-opt.active { color: var(--green); }

  /* ── WORKSPACE SPLIT ── */
  .workspace { flex: 1; display: flex; flex-direction: row; min-height: 0; overflow: hidden; }
  .pane { display: flex; flex-direction: column; min-width: 120px; min-height: 0; overflow: hidden; }
  #pane-left  { flex: 0 0 auto; width: 40%; }
  #pane-right { flex: 1 1 0; }

  .pane-header {
    flex-shrink: 0; padding: 9px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .pane-header .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2); box-shadow: 0 0 8px rgba(255,107,53,0.6);
    animation: pulse 2s infinite; flex-shrink: 0;
  }
  .pane-header .dot.green { background: var(--green); box-shadow: var(--glow2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #src-preview {
    flex: 1; background: var(--bg); border: none; color: var(--hex);
    font-family: 'Share Tech Mono', monospace; font-size: 12px; line-height: 1.7;
    padding: 18px; resize: none; outline: none; letter-spacing: 0.3px;
  }
  #src-preview::placeholder { color: var(--dim); }

  #splitter {
    flex-shrink: 0; width: 6px; background: var(--border); cursor: col-resize;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; position: relative;
  }
  #splitter:hover, #splitter.dragging { background: var(--accent2); }
  #splitter::after {
    content: '⋮'; color: var(--dim); font-size: 14px;
    position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none;
  }

  #output-area {
    flex: 1; overflow-y: auto; overflow-x: auto;
    padding: 18px 22px; font-size: 13px; line-height: 1.75; letter-spacing: 0.3px;
  }
  #output-area::-webkit-scrollbar { width: 6px; height: 6px; }
  #output-area::-webkit-scrollbar-track { background: var(--bg); }
  #output-area::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }

  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden; margin-bottom: 20px;
  }
  .summary-cell { background: var(--panel); padding: 12px 16px; }
  .summary-key { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
  .summary-val { font-size: 14px; color: var(--accent); font-family: 'Orbitron', monospace; font-weight: 700; }
  .summary-val.orange { color: var(--accent2); }
  .summary-val.green  { color: var(--green); }
  .summary-val.purple { color: var(--purple); }

  .out-block-header {
    color: var(--muted); font-size: 11px; letter-spacing: 2px;
    border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 8px; margin-top: 22px;
  }
  .out-block-header:first-of-type { margin-top: 0; }
  .out-block-header.orange { color: var(--accent2); }
  .out-block-header.green  { color: var(--green); }

  .out-code {
    font-family: 'Share Tech Mono', monospace;
    white-space: pre-wrap; word-break: break-word;
    color: var(--text); margin-bottom: 10px;
  }
  .out-code .ln { color: var(--addr); }
  .out-code.dim { color: var(--muted); font-size: 12px; }

  .out-error { color: var(--error); font-size: 12px; padding: 4px 0; }
  .out-warn  { color: var(--accent2); font-size: 12px; padding: 4px 0; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 14px; opacity: 0.35;
  }
  .empty-state svg { opacity: 0.5; }
  .empty-state p { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-align: center; line-height: 1.8; }

  #pane-left.drag-over { outline: 1px dashed var(--accent2); outline-offset: -1px; background: rgba(255,107,53,0.04); }

  #src-preview::-webkit-scrollbar { width: 6px; }
  #src-preview::-webkit-scrollbar-track { background: var(--bg); }
  #src-preview::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
</style>
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<header>
  <a class="logo" href="index.html">SC<span>61860</span></a>
  <div>
    <div style="font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:2px">LOADER GENERATOR</div>
    <div class="tagline">BIN → FOR/READ/POKE BASIC LOADER</div>
  </div>
  <a class="nav-back" href="index.html">← INDEX</a>
  <div class="badge">
    <em>PC-1401 / 1403 / 1350 / 1360</em><br>
    carve-out pointer + port config
  </div>
</header>

<div class="controls">
  <button type="button" class="btn btn-orange" id="gen-btn" onclick="generate()" disabled>▶ GENERATE</button>
  <button type="button" class="btn btn-secondary" onclick="loadFile()">↑ LOAD .BIN</button>
  <button type="button" class="btn btn-secondary" onclick="clearInput()">✕ CLEAR</button>
  <input type="file" id="file-input" accept=".bin,*/*" style="display:none">

  <div class="sep"></div>

  <div class="fieldset">
    <label for="device-sel">DEVICE</label>
    <select id="device-sel" class="small-input" onchange="onDeviceChange()">
      <option value="PC-1401">PC-1401</option>
      <option value="PC-1403">PC-1403</option>
      <option value="PC-1350">PC-1350</option>
      <option value="PC-1360" selected>PC-1360</option>
    </select>
  </div>
  <div class="fieldset">
    <label for="config-sel">MEMORY CONFIG</label>
    <select id="config-sel" class="small-input" onchange="onConfigChange()" style="width:190px"></select>
  </div>
  <div class="fieldset">
    <label for="start-addr">START (HEX)</label>
    <input id="start-addr" class="small-input" type="text" value="E030" style="width:76px" oninput="onStartAddrEdit()">
  </div>

  <div class="sep"></div>

  <div class="fieldset">
    <label for="eol-sel">EOL</label>
    <select id="eol-sel" class="small-input" style="width:72px">
      <option value="CR">CR</option>
      <option value="LF">LF</option>
      <option value="CRLF" selected>CR/LF</option>
    </select>
  </div>
  <div class="fieldset">
    <label for="term-input">EOF BYTE</label>
    <input id="term-input" class="small-input" type="text" value="1A" style="width:64px" title='Hex byte, e.g. 1A, or "none"'>
  </div>
  <div class="fieldset">
    <label for="bpl-sel">DATA/LINE</label>
    <select id="bpl-sel" class="small-input" style="width:64px">
      <option value="8">8</option>
      <option value="16" selected>16</option>
      <option value="32">32</option>
      <option value="64">64</option>
    </select>
  </div>
  <div class="fieldset">
    <label for="split-sel" title="Generates several independently-typeable loaders instead of one big one, each sized so its RENDERED TEXT (the actual .txt file, not the input binary) stays at or under this size">SPLIT</label>
    <select id="split-sel" class="small-input" style="width:170px" title='Sizes each part by its rendered OUTPUT text length, not input bytes — a DATA value like "255" prints wider than "0", so this is the only way to actually bound each part. Only the last part CALLs and runs the program — see the loading instructions in the output panel after generating.'>
      <option value="0" selected>NO SPLIT</option>
      <option value="512">≤0.5 KB / PART (OUTPUT)</option>
      <option value="1024">≤1 KB / PART (OUTPUT)</option>
      <option value="2048">≤2 KB / PART (OUTPUT)</option>
      <option value="3072">≤3 KB / PART (OUTPUT)</option>
      <option value="4096">≤4 KB / PART (OUTPUT)</option>
    </select>
  </div>

  <div class="sep"></div>

  <div class="toggle-group">
    <span class="toggle-label">MEM CHECK</span>
    <div class="toggle-wrap" id="memcheck-toggle" onclick="cycleMemcheck()">
      <div class="toggle-opt active" id="mc-on">ON</div>
      <div class="toggle-opt" id="mc-off">OFF</div>
      <div class="toggle-slider" id="mc-slider"></div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="toggle-group">
    <span class="toggle-label">COMPRESS ZEROS</span>
    <div class="toggle-wrap" id="compress-toggle" onclick="cycleCompress()">
      <div class="toggle-opt" id="cz-on">ON</div>
      <div class="toggle-opt active" id="cz-off">OFF</div>
      <div class="toggle-slider" id="cz-slider"></div>
    </div>
  </div>

  <div class="sep"></div>
  <button class="btn btn-green" id="dl-btn" onclick="downloadLoader()" disabled>↓ LOADER TXT</button>

  <div class="sep"></div>
  <div class="hint" id="stat-pill">NO FILE LOADED</div>
</div>

<div class="workspace" id="workspace">

  <div class="pane" id="pane-left">
    <div class="pane-header">
      <div class="dot"></div>
      BINARY SOURCE
      <span style="margin-left:auto;font-size:10px;color:var(--dim)">DROP .BIN OR LOAD FILE</span>
    </div>
    <textarea id="src-preview" readonly spellcheck="false" placeholder="Load or drop a .bin file — a hex preview appears here."></textarea>
  </div>

  <div id="splitter"></div>

  <div class="pane" id="pane-right">
    <div class="pane-header">
      <div class="dot green"></div>
      LOADER OUTPUT
    </div>
    <div id="output-area">
      <div class="empty-state" id="empty-state">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="48" height="48" rx="4" stroke="#3a4a5a" stroke-width="1.5"/>
          <path d="M18 22h28M18 30h28M18 38h18" stroke="#3a4a5a" stroke-width="1"/>
          <circle cx="50" cy="50" r="10" fill="#0a0c10" stroke="#ff6b35" stroke-width="1.5"/>
          <text x="50" y="54" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff6b35">POKE</text>
        </svg>
        <p>LOAD A .BIN FILE, PICK A DEVICE<br>THEN PRESS ▶ GENERATE</p>
      </div>
    </div>
  </div>

</div>

<script>
// ── Device data: BASIC-start pointers, factory-default check values, and
//    carve-out load addresses per device/memory configuration ─────────────
const DEVICES = {
  'PC-1401': {
    pointer: { lo: 0x46e1, hi: 0x46e2 },
    checkDefault: { lo: 0, hi: 60 },
    configs: [
      { id: 'std', label: 'Standard (&3800)', addr: 0x3800, note: 'Fixed conventional free-memory start address.' },
    ],
  },
  'PC-1403': {
    pointer: { lo: 0xff01, hi: 0xff02 },
    checkDefault: { lo: 48, hi: 224 },
    configs: [
      { id: 'std', label: 'Standard (&E038)', addr: 0xe038, note: 'Fixed conventional free-memory start address.' },
    ],
  },
  'PC-1350': {
    pointer: { lo: 0x6f01, hi: 0x6f02 },
    checkDefault: { lo: 48, hi: 96 },
    flagByte: 0x6f00,
    configs: [
      { id: 'nocard', label: 'No RAM card (&6000)', addr: 0x6000, note: 'Internal-only user memory area — the no-card case.' },
      { id: 'card2000', label: 'RAM card, base &2000', addr: 0x2000, note: 'Flag byte &6F00 selects this base — confirm it matches your card.' },
      { id: 'card4000', label: 'RAM card, base &4000', addr: 0x4000, note: 'Flag byte &6F00 selects this base — confirm it matches your card.' },
    ],
  },
  'PC-1360': {
    pointer: { lo: 0xffd7, hi: 0xffd8 },
    checkDefault: { lo: 48, hi: 160 },
    configs: [
      { id: 'card8k', label: '8 KB RAM card (&E030)', addr: 0xe030, note: 'No internal program RAM without a fitted card — pick the option matching your card size.' },
      { id: 'card16k', label: '16 KB RAM card (&C030)', addr: 0xc030, note: 'No internal program RAM without a fitted card — pick the option matching your card size.' },
      { id: 'card32k', label: '32 KB RAM card (&8030)', addr: 0x8030, note: 'No internal program RAM without a fitted card — pick the option matching your card size.' },
    ],
  },
};
const PORT_CONFIG_DEVICES = new Set(['PC-1350', 'PC-1360']);
const EOL_LETTER = { CR: 'C', LF: 'F', CRLF: 'L' };
const EOL_BYTES  = { CR: [0x0d], LF: [0x0a], CRLF: [0x0d, 0x0a] };
const DATA_LINE_START = 1000, DATA_LINE_STEP = 10, HEADER_LINE_STEP = 10;
const MEMCHECK_MESSAGE = 'MEM NOT PROTECTED';

const hex  = (n) => n.toString(16).toUpperCase();
const hex2 = (n) => n.toString(16).toUpperCase().padStart(2, '0');
const hex4 = (n) => n.toString(16).toUpperCase().padStart(4, '0');

let fileBytes = null;
let fileBaseName = 'loader';
let generatedBytes = null;
let loaderParts = null;
let memcheckOn = true;
let compressOn = false;

const deviceSel   = document.getElementById('device-sel');
const configSel   = document.getElementById('config-sel');
const startAddrEl = document.getElementById('start-addr');
const eolSel      = document.getElementById('eol-sel');
const termEl      = document.getElementById('term-input');
const bplSel      = document.getElementById('bpl-sel');
const splitSel    = document.getElementById('split-sel');
const genBtn      = document.getElementById('gen-btn');
const dlBtn       = document.getElementById('dl-btn');
const statPill    = document.getElementById('stat-pill');
const outputArea  = document.getElementById('output-area');
const emptyState  = document.getElementById('empty-state');
const srcPreview  = document.getElementById('src-preview');
const fileInput   = document.getElementById('file-input');
const paneLeft    = document.getElementById('pane-left');

// ── Memcheck toggle ─────────────────────────────────────────────────────
function cycleMemcheck() {
  memcheckOn = !memcheckOn;
  updateMemcheckUI();
}
function updateMemcheckUI() {
  document.getElementById('mc-on').classList.toggle('active', memcheckOn);
  document.getElementById('mc-off').classList.toggle('active', !memcheckOn);
  const wrap   = document.getElementById('memcheck-toggle');
  const slider = document.getElementById('mc-slider');
  const active = document.getElementById(memcheckOn ? 'mc-on' : 'mc-off');
  slider.style.left  = active.offsetLeft + 'px';
  slider.style.width = active.offsetWidth + 'px';
}

// ── Zero-run compression toggle ─────────────────────────────────────────
function cycleCompress() {
  compressOn = !compressOn;
  updateCompressUI();
}
function updateCompressUI() {
  document.getElementById('cz-on').classList.toggle('active', compressOn);
  document.getElementById('cz-off').classList.toggle('active', !compressOn);
  const wrap   = document.getElementById('compress-toggle');
  const slider = document.getElementById('cz-slider');
  const active = document.getElementById(compressOn ? 'cz-on' : 'cz-off');
  slider.style.left  = active.offsetLeft + 'px';
  slider.style.width = active.offsetWidth + 'px';
}

// ── Device / memory-config dropdowns ───────────────────────────────────
function currentConfig() {
  const dev = DEVICES[deviceSel.value];
  return dev.configs.find(c => c.id === configSel.value) || dev.configs[0];
}
function onDeviceChange() {
  const dev = DEVICES[deviceSel.value];
  configSel.innerHTML = dev.configs.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  applyConfig();
}
function onConfigChange() { applyConfig(); }
function applyConfig() {
  startAddrEl.value = hex(currentConfig().addr);
}
function onStartAddrEdit() { /* free edit, no side effects */ }

// ── Parsing helpers ─────────────────────────────────────────────────────
function parseHexAddrInput(str) {
  const cleaned = str.trim().replace(/^&/, '').replace(/^0x/i, '');
  if (!/^[0-9a-fA-F]+$/.test(cleaned)) return NaN;
  return parseInt(cleaned, 16);
}
function parseTermInput(str) {
  const s = str.trim();
  if (s.toLowerCase() === 'none' || s === '') return { ok: true, value: null };
  const cleaned = s.replace(/^&/, '').replace(/^0x/i, '');
  if (!/^[0-9a-fA-F]{1,2}$/.test(cleaned)) return { ok: false };
  const val = parseInt(cleaned, 16);
  if (!Number.isFinite(val) || val < 0 || val > 0xff) return { ok: false };
  return { ok: true, value: val };
}

// Zero-run compression: 256 (one past the 0-255 byte range) can never
// appear as a real byte, so it marks a run-length record in the DATA
// stream instead of a literal byte; the next DATA value is the run
// length. Only runs of MIN_RUN_LENGTH+ zero bytes are worth it — a run
// always costs exactly 2 DATA values, so anything shorter is cheaper left
// as literal zeros.
const RUN_SENTINEL = 256;
const MIN_RUN_LENGTH = 4;

function encodeCompressedTokens(bytes) {
  const tokens = [];
  let i = 0;
  while (i < bytes.length) {
    if (bytes[i] === 0) {
      let j = i;
      while (j < bytes.length && bytes[j] === 0) j++;
      const runLength = j - i;
      if (runLength >= MIN_RUN_LENGTH) {
        tokens.push(RUN_SENTINEL, runLength);
        i = j;
        continue;
      }
    }
    tokens.push(bytes[i]);
    i++;
  }
  return tokens;
}

// Line merging: multiple statements can share one physical BASIC line,
// separated by colons, as long as doing so can't break a jump.
//  - A statement that's the TARGET of some IF/GOTO elsewhere must start
//    its own line — GOTO/THEN can only address a line number, not a
//    position partway through one, so folding a jump target into the
//    previous line would make it unreachable.
//  - 'if' and 'goto' statements only ever appear as the LAST statement on
//    a line, never followed by more statements on the same line.
//    Conservative form, matches how these loaders have been hand-verified
//    on real hardware so far.
// MAX_STATEMENTS_PER_LINE caps how many statements can share one line even
// when neither rule above would stop it, for the same conservative reason
// BYTES_PER_LINE is capped — real per-line length limits aren't documented.
const MAX_STATEMENTS_PER_LINE = 2;

// ── Loader line builder (mirrors the CLI tool exactly) ─────────────────
// With compressEnabled off, the body is the classic fixed FOR/READ/POKE/NEXT
// loop. With it on, the body instead walks the DATA stream one record at a
// time via an equivalent GOTO-driven loop, since a single zero-run record
// can fill many addresses at once (see bin2basic-loader.js for the full
// design note — this mirrors it exactly). Statements are then merged onto
// shared lines wherever that's safe (see MAX_STATEMENTS_PER_LINE above).
function buildLoaderLines(deviceKey, startAddr, endAddr, memCheckEnabled, compressEnabled, opts) {
  opts = opts || {};
  const memcheckLength = opts.memcheckLength != null ? opts.memcheckLength : (endAddr - startAddr + 1);
  const callAddr = opts.callAddr !== undefined ? opts.callAddr : startAddr;

  const dev = DEVICES[deviceKey];
  const stmts = [];       // { type: 'plain'|'if'|'goto'|'end', render(L) => string }
  const targets = new Set();
  const push = (type, fn) => { stmts.push({ type, render: fn }); return stmts.length - 1; };
  const mark = (idx) => { targets.add(idx); return idx; };

  let bodyStartIndex = -1;
  if (memCheckEnabled) {
    const p = dev.pointer, d = dev.checkDefault;
    const defaultValue = d.lo + 256 * d.hi;
    push('plain', () => `C=PEEK(${p.lo})`);
    push('plain', () => `D=PEEK(${p.hi})`);
    push('plain', () => `B=C+256*D`);
    push('if', (L) => `IF B-${defaultValue}>${memcheckLength} THEN ${L[bodyStartIndex]}`);
    push('plain', () => `PRINT "${MEMCHECK_MESSAGE}"`);
    push('end', () => `END`);
  }

  if (compressEnabled) {
    let runIndex;
    let doneIndex;
    bodyStartIndex = mark(stmts.length);
    push('plain', () => `A=${startAddr}`);
    const loopTopIndex = mark(push('if', (L) => `IF A>${endAddr} THEN ${L[doneIndex]}`));
    push('plain', () => `READ B`);
    push('if', (L) => `IF B=${RUN_SENTINEL} THEN ${L[runIndex]}`);
    push('plain', () => `POKE A,B`);
    push('plain', () => `A=A+1`);
    push('goto', (L) => `GOTO ${L[loopTopIndex]}`);
    runIndex = mark(stmts.length);
    push('plain', () => `READ N`);
    const runLoopIndex = mark(stmts.length);
    push('plain', () => `POKE A,0`);
    push('plain', () => `A=A+1`);
    push('plain', () => `N=N-1`);
    push('if', (L) => `IF N>0 THEN ${L[runLoopIndex]}`);
    push('goto', (L) => `GOTO ${L[loopTopIndex]}`);
    doneIndex = mark(stmts.length);
    if (callAddr !== null) push('plain', () => `CALL ${callAddr}`);
    push('end', () => `END`);
  } else {
    bodyStartIndex = mark(stmts.length);
    push('plain', () => `FOR A=${startAddr} TO ${endAddr}`);
    push('plain', () => `READ B`);
    push('plain', () => `POKE A,B`);
    push('plain', () => `NEXT A`);
    if (callAddr !== null) push('plain', () => `CALL ${callAddr}`);
    push('end', () => `END`);
  }

  const lineNumbers = [];
  let ln = HEADER_LINE_STEP;
  for (let i = 0; i < stmts.length; i++) { lineNumbers.push(ln); ln += HEADER_LINE_STEP; }

  // Group consecutive statements onto shared lines: a group always starts
  // fresh at a jump target, and otherwise keeps absorbing the next
  // statement until the cap is hit, the next statement is itself a
  // target, or the statement just added was an 'if'/'goto'/'end'.
  const groups = [];
  let i = 0;
  while (i < stmts.length) {
    const group = [i];
    let lastType = stmts[i].type;
    i++;
    while (
      i < stmts.length &&
      group.length < MAX_STATEMENTS_PER_LINE &&
      !targets.has(i) &&
      lastType !== 'if' && lastType !== 'goto' && lastType !== 'end'
    ) {
      group.push(i);
      lastType = stmts[i].type;
      i++;
    }
    groups.push(group);
  }

  return groups.map((group) => {
    const text = group.map((idx) => stmts[idx].render(lineNumbers)).join(': ');
    return `${lineNumbers[group[0]]} ${text}`;
  });
}

// Builds one complete, independently-typeable loader program (header +
// DATA lines) for a single contiguous slice of bytes. Used directly for
// the whole binary in non-split mode, and once per chunk in split mode.
function renderLoaderPart(deviceKey, chunkBytes, chunkStartAddr, memCheckEnabled, compressEnabled, opts, bpl) {
  const chunkEndAddr = chunkStartAddr + chunkBytes.length - 1;
  const lines = buildLoaderLines(deviceKey, chunkStartAddr, chunkEndAddr, memCheckEnabled, compressEnabled, opts);
  const tokens = compressEnabled ? encodeCompressedTokens(chunkBytes) : Array.from(chunkBytes);
  let dataLn = DATA_LINE_START;
  for (let i = 0; i < tokens.length; i += bpl) {
    const dataChunk = tokens.slice(i, i + bpl);
    lines.push(`${dataLn} DATA ${dataChunk.join(',')}`);
    dataLn += DATA_LINE_STEP;
  }
  return { lines, tokens, chunkEndAddr };
}

// Splits `bytes` (the FULL binary) into loader parts sized against the
// RENDERED OUTPUT byte length (the actual .txt file TeraTerm sends), not the
// raw input byte count. DATA values vary in printed width — a zero byte
// prints as "0" (1 char), a 0xFF byte as "255" (3 chars) plus a comma each —
// so a fixed input-byte chunk size doesn't reliably bound how big the
// resulting program text ends up. This greedily grows each chunk (binary
// search on chunk length) until adding one more byte would push the
// rendered part over targetOutputBytes. Every trial size is rendered as if
// it will be the LAST part (i.e. always includes the CALL statement, the
// biggest a part can get) so no part can end up over target once the real
// last/interior flags are assigned afterward.
function splitIntoParts(deviceKey, bytes, startAddr, memCheckEnabled, compressEnabled, targetOutputBytes, bpl, encodeOutput) {
  const totalLength = bytes.length;
  const chunkSizes = [];
  let oversizedCount = 0;
  let minPossibleOutputBytes = Infinity;
  let offset = 0;
  while (offset < totalLength) {
    const remaining = totalLength - offset;
    let lo = 1, hi = remaining, best = 1;
    while (lo <= hi) {
      const mid = lo + Math.floor((hi - lo) / 2);
      const chunkBytes = bytes.slice(offset, offset + mid);
      const chunkStartAddr = startAddr + offset;
      const { lines } = renderLoaderPart(
        deviceKey, chunkBytes, chunkStartAddr, memCheckEnabled, compressEnabled,
        { memcheckLength: totalLength, callAddr: startAddr }, bpl
      );
      const size = encodeOutput(lines).length;
      if (size <= targetOutputBytes) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    // Even a single-byte chunk can't fit under target (fixed overhead from
    // the memcheck/header lines alone exceeds it) — take it anyway (can't
    // make forward progress with a 0-byte chunk) and record it for the
    // summary warning.
    const chunkBytes1 = bytes.slice(offset, offset + best);
    const { lines: lines1 } = renderLoaderPart(
      deviceKey, chunkBytes1, startAddr + offset, memCheckEnabled, compressEnabled,
      { memcheckLength: totalLength, callAddr: startAddr }, bpl
    );
    const size1 = encodeOutput(lines1).length;
    if (best === 1 && size1 > targetOutputBytes) {
      oversizedCount++;
      if (size1 < minPossibleOutputBytes) minPossibleOutputBytes = size1;
    }
    chunkSizes.push(best);
    offset += best;
  }

  const numParts = chunkSizes.length;
  const parts = [];
  let runningOffset = 0;
  for (let idx = 0; idx < numParts; idx++) {
    const len = chunkSizes[idx];
    const isLast = idx === numParts - 1;
    const chunkBytes = bytes.slice(runningOffset, runningOffset + len);
    const chunkStartAddr = startAddr + runningOffset;
    const { lines, tokens, chunkEndAddr } = renderLoaderPart(
      deviceKey, chunkBytes, chunkStartAddr, memCheckEnabled, compressEnabled,
      { memcheckLength: totalLength, callAddr: isLast ? startAddr : null }, bpl
    );
    parts.push({ partNum: idx + 1, numParts, lines, tokens, chunkBytes, chunkStartAddr, chunkEndAddr, isLast });
    runningOffset += len;
  }
  parts.oversizedCount = oversizedCount;
  parts.minPossibleOutputBytes = oversizedCount ? minPossibleOutputBytes : null;
  return parts;
}

function portConfigText(deviceKey, eolName, termByte) {
  if (!PORT_CONFIG_DEVICES.has(deviceKey)) return null;
  if (termByte === null) {
    return `${deviceKey} needs an end-of-program byte for this OPEN statement, ` +
      `but EOF BYTE is set to "none". Pick an actual byte (e.g. the default 1A) to get the OPEN statement.`;
  }
  const eolLetter = EOL_LETTER[eolName];
  const v2 = '&' + hex2(termByte);
  const eolWord = eolName === 'CR' ? 'CR' : eolName === 'LF' ? 'LF' : 'CR/LF';
  return (
    `Before sending the loader with TeraTerm, configure ${deviceKey}'s serial port to match the\n` +
    `EOL (${eolName}) / EOF (${v2}) settings above by running:\n\n` +
    `  OPEN "1200,N,8,1,A,${eolLetter},${v2}"\n\n` +
    `This opens the port at 1200 baud, no parity, 8 data bits, 1 stop bit, protocol A, with ${eolWord} as\n` +
    `the line terminator and ${v2} as the end-of-program terminator.\n` +
    `Match TeraTerm's own serial setup (Setup > Serial port) to 1200 baud, 8N1, and send the\n` +
    `generated .txt file as-is — no newline translation, since the file already contains the exact\n` +
    `bytes above.`
  );
}

function carveOutText(deviceKey, startAddr, length) {
  const dev = DEVICES[deviceKey];
  const p = dev.pointer;
  const endAddr = startAddr + length - 1;
  const newStart = startAddr + length;
  const lo = newStart & 0xff;
  const hi_ = (newStart >> 8) & 0xff;

  let text =
    `Machine code occupies &${hex(startAddr)}-&${hex(endAddr)} (${length} bytes).\n\n` +
    `Before typing or loading the loader below, raise ${deviceKey}'s BASIC program-start pointer\n` +
    `to &${hex(newStart)} — that reserves &${hex(startAddr)}-&${hex(endAddr)} so BASIC never writes into it:\n\n` +
    `  POKE &${hex(p.lo)},${lo}\n` +
    `  POKE &${hex(p.hi)},${hi_}\n\n` +
    `Then enter/load the loader — it will be stored starting at &${hex(newStart)}, above the protected\n` +
    `area. RUN it to POKE the binary into place, then CALL &${hex(startAddr)} to execute it.\n\n` +
    `(Assumes little-endian pointer bytes: &${hex(p.lo)}=low, &${hex(p.hi)}=high — flip the two POKE\n` +
    `values if that turns out backwards on real hardware.)`;

  if (dev.flagByte !== undefined) {
    text += `\n\nNote: flag byte &${hex(dev.flagByte)} selects this device's RAM-card base (&2000/&4000)\n` +
      `vs. no-card (&6000) — make sure the memory config above matches your actual card.`;
  }
  if (deviceKey === 'PC-1360') {
    text += `\n\nNote: the exact safe window also depends on your RAM card size and, if two cards are\n` +
      `fitted, the active MEM$ mode — double-check the memory config above matches your hardware.`;
  }
  return text;
}

// ── File loading ─────────────────────────────────────────────────────────
function loadFile() { fileInput.value = ''; fileInput.click(); }
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

paneLeft.addEventListener('dragover', e => { e.preventDefault(); paneLeft.classList.add('drag-over'); });
paneLeft.addEventListener('dragleave', () => paneLeft.classList.remove('drag-over'));
paneLeft.addEventListener('drop', e => {
  e.preventDefault();
  paneLeft.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    fileBytes = new Uint8Array(reader.result);
    fileBaseName = file.name.replace(/\.[^.]+$/, '') || 'loader';
    renderSourcePreview(file.name);
    genBtn.disabled = false;
    dlBtn.disabled = true;
    generatedBytes = null;
    outputArea.innerHTML = '';
    outputArea.appendChild(emptyState);
    emptyState.style.display = '';
    statPill.textContent = `${file.name} — ${fileBytes.length} BYTES — PRESS GENERATE`;
  };
  reader.readAsArrayBuffer(file);
}

function renderSourcePreview(filename) {
  const width = 16;
  const rows = [`; ${filename}  (${fileBytes.length} bytes)`, ''];
  for (let off = 0; off < fileBytes.length; off += width) {
    const chunk = [];
    for (let i = 0; i < width; i++) {
      const idx = off + i;
      chunk.push(idx < fileBytes.length ? hex2(fileBytes[idx]) : '  ');
    }
    rows.push(`${hex4(off)}: ${chunk.join(' ')}`);
  }
  srcPreview.value = rows.join('\n');
}

function clearInput() {
  fileBytes = null;
  generatedBytes = null;
  srcPreview.value = '';
  genBtn.disabled = true;
  dlBtn.disabled = true;
  outputArea.innerHTML = '';
  outputArea.appendChild(emptyState);
  emptyState.style.display = '';
  statPill.textContent = 'NO FILE LOADED';
}

// ── Generate ─────────────────────────────────────────────────────────────
function encodeLoaderBytes(lines, eolBytes, termByte) {
  const encoder = new TextEncoder();
  const chunks = [];
  for (const line of lines) {
    chunks.push(encoder.encode(line));
    chunks.push(new Uint8Array(eolBytes));
  }
  if (termByte !== null) chunks.push(new Uint8Array([termByte]));
  const totalLen = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(totalLen);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function generate() {
  outputArea.innerHTML = '';
  const errors = [];

  if (!fileBytes) { errors.push('No .bin file loaded.'); }

  const startAddr = parseHexAddrInput(startAddrEl.value);
  if (!Number.isFinite(startAddr)) errors.push('Bad start address: expected hex, e.g. 80E8 or &80E8.');

  const eolName = eolSel.value;
  const termResult = parseTermInput(termEl.value);
  if (!termResult.ok) errors.push('Bad EOF byte: expected a hex byte like 1A, or "none".');

  const bpl = parseInt(bplSel.value, 10);

  if (errors.length) {
    for (const e of errors) {
      const p = document.createElement('div');
      p.className = 'out-error';
      p.textContent = '⚠ ' + e;
      outputArea.appendChild(p);
    }
    return;
  }
  emptyState.style.display = 'none';

  const deviceKey = deviceSel.value;
  const termByte  = termResult.value;
  const endAddr   = startAddr + fileBytes.length - 1;
  const eolBytes  = EOL_BYTES[eolName];
  const splitBytes = parseInt(splitSel.value, 10);
  const isSplit = splitBytes > 0 && splitBytes < fileBytes.length;

  if (!isSplit) {
    loaderParts = null;
    const { lines, tokens } = renderLoaderPart(deviceKey, fileBytes, startAddr, memcheckOn, compressOn, {}, bpl);
    generatedBytes = encodeLoaderBytes(lines, eolBytes, termByte);

    // ── render summary ──
    const sg = document.createElement('div');
    sg.className = 'summary-grid';
    const cells = [
      ['DEVICE', deviceKey, 'orange'],
      ['START', `&${hex(startAddr)}`, ''],
      ['END', `&${hex(endAddr)}`, 'orange'],
      ['BYTES', fileBytes.length.toString(), 'green'],
      ['LINES', lines.length.toString(), ''],
      ['EOL / EOF', `${eolName} / ${termByte !== null ? '&' + hex2(termByte) : 'NONE'}`, 'purple'],
      ['MEM CHECK', memcheckOn ? 'ON' : 'OFF', memcheckOn ? 'green' : ''],
      ['COMPRESS', compressOn ? `ON (${tokens.length} vs ${fileBytes.length})` : 'OFF', compressOn ? 'green' : ''],
      ['SPLIT', 'OFF', ''],
    ];
    for (const [k, v, cls] of cells) {
      const c = document.createElement('div');
      c.className = 'summary-cell';
      c.innerHTML = `<div class="summary-key">${k}</div><div class="summary-val ${cls}">${v}</div>`;
      sg.appendChild(c);
    }
    outputArea.appendChild(sg);

    // Shared blocks (serial port config + the carve-out POKEs that protect
    // memory from BASIC) come BEFORE the loader listing: they're the steps
    // you need to act on first, and burying them below a long DATA listing
    // made them easy to miss.
    appendSharedBlocks(deviceKey, startAddr, eolName, termByte);

    // ── loader listing ──
    const hdr1 = document.createElement('div');
    hdr1.className = 'out-block-header';
    hdr1.textContent = '; BASIC LOADER';
    outputArea.appendChild(hdr1);
    const code1 = document.createElement('div');
    code1.className = 'out-code';
    code1.textContent = lines.join('\n');
    outputArea.appendChild(code1);

    dlBtn.disabled = false;
    dlBtn.textContent = '↓ LOADER TXT';
    statPill.innerHTML = `${deviceKey} · ${lines.length} LINES · ${fileBytes.length} BYTES · &${hex(startAddr)}–&${hex(endAddr)}`;
  } else {
    const encodeOutput = (lines) => encodeLoaderBytes(lines, eolBytes, termByte);
    const partList = splitIntoParts(deviceKey, fileBytes, startAddr, memcheckOn, compressOn, splitBytes, bpl, encodeOutput);
    loaderParts = partList.map((part) => ({ ...part, bytes: encodeOutput(part.lines) }));

    // ── render overall summary ──
    const totalLines = loaderParts.reduce((n, p) => n + p.lines.length, 0);
    const sg = document.createElement('div');
    sg.className = 'summary-grid';
    const cells = [
      ['DEVICE', deviceKey, 'orange'],
      ['START', `&${hex(startAddr)}`, ''],
      ['END', `&${hex(endAddr)}`, 'orange'],
      ['BYTES', fileBytes.length.toString(), 'green'],
      ['LINES (ALL PARTS)', totalLines.toString(), ''],
      ['EOL / EOF', `${eolName} / ${termByte !== null ? '&' + hex2(termByte) : 'NONE'}`, 'purple'],
      ['MEM CHECK', memcheckOn ? 'ON' : 'OFF', memcheckOn ? 'green' : ''],
      ['COMPRESS', compressOn ? 'ON' : 'OFF', compressOn ? 'green' : ''],
      ['SPLIT', `${loaderParts.length} PARTS, ≤${splitBytes}B OUTPUT EACH`, 'green'],
    ];
    for (const [k, v, cls] of cells) {
      const c = document.createElement('div');
      c.className = 'summary-cell';
      c.innerHTML = `<div class="summary-key">${k}</div><div class="summary-val ${cls}">${v}</div>`;
      sg.appendChild(c);
    }
    outputArea.appendChild(sg);

    if (partList.oversizedCount) {
      const warn = document.createElement('div');
      warn.className = 'out-error';
      warn.textContent =
        `⚠ ${partList.oversizedCount} of ${loaderParts.length} part(s) exceed the target anyway, even at ` +
        `1 input byte each — the fixed overhead (memcheck + header lines) alone is already at least ` +
        `${partList.minPossibleOutputBytes} bytes for ${deviceKey}, bigger than the ${splitBytes}-byte target. ` +
        `Pick a larger SPLIT size, or turn MEM CHECK off, to get every part under target.`;
      outputArea.appendChild(warn);
    }

    // ── how-to-load instructions ──
    const hdrHow = document.createElement('div');
    hdrHow.className = 'out-block-header orange';
    hdrHow.textContent = '; HOW TO LOAD A SPLIT PROGRAM';
    outputArea.appendChild(hdrHow);
    const codeHow = document.createElement('div');
    codeHow.className = 'out-code dim';
    codeHow.textContent =
      `This binary is being sent as ${loaderParts.length} separate loader programs since one loader was ` +
      `too long. The carve-out and memory-protection check below are sized for the FULL ${fileBytes.length}-byte ` +
      `program — do the carve-out ONCE for the whole thing before typing Part 1. Then for each part, in order:\n\n` +
      `  1. Type or load the part and RUN it (it only POKEs its own byte range — it does NOT execute\n` +
      `     the program until you reach the last part).\n` +
      `  2. Run NEW to clear the BASIC program text. This does NOT erase the bytes you just POKEd —\n` +
      `     NEW only clears the typed program listing, not general memory.\n` +
      `  3. Move on to the next part and repeat.\n\n` +
      `The LAST part (Part ${loaderParts.length} of ${loaderParts.length}) also CALLs the program after ` +
      `POKEing its bytes, so running it executes the whole assembled program automatically — no separate ` +
      `CALL step needed.`;
    outputArea.appendChild(codeHow);

    // Shared blocks (serial port config + carve-out POKEs) next, before the
    // part listings — do these once, before typing Part 1, so they need to
    // be visible before you scroll into the (potentially long) code below.
    appendSharedBlocks(deviceKey, startAddr, eolName, termByte);

    // ── one block per part ──
    loaderParts.forEach((part) => {
      const hdr = document.createElement('div');
      hdr.className = 'out-block-header' + (part.isLast ? ' green' : '');
      hdr.style.display = 'flex';
      hdr.style.alignItems = 'center';
      hdr.style.gap = '10px';
      const label = document.createElement('span');
      label.textContent = `; BASIC LOADER — PART ${part.partNum} OF ${part.numParts}` +
        (part.isLast ? ' (CALLS & RUNS)' : ' (POKE ONLY)');
      hdr.appendChild(label);
      const dlPartBtn = document.createElement('button');
      dlPartBtn.type = 'button';
      dlPartBtn.className = 'btn btn-green';
      dlPartBtn.style.marginLeft = 'auto';
      dlPartBtn.style.fontSize = '10px';
      dlPartBtn.textContent = `↓ PART ${part.partNum}`;
      dlPartBtn.onclick = () => {
        const blob = new Blob([part.bytes], { type: 'application/octet-stream' });
        triggerDownload(blob, `${fileBaseName}_part${part.partNum}of${part.numParts}.txt`);
      };
      hdr.appendChild(dlPartBtn);
      outputArea.appendChild(hdr);

      const meta = document.createElement('div');
      meta.className = 'out-code dim';
      meta.style.padding = '4px 12px';
      meta.textContent =
        `&${hex(part.chunkStartAddr)}-&${hex(part.chunkEndAddr)} (${part.chunkBytes.length} bytes) · ` +
        `${part.lines.length} lines · ${part.bytes.length} output bytes` +
        (compressOn ? ` · ${part.tokens.length} DATA values` : '');
      outputArea.appendChild(meta);

      const code = document.createElement('div');
      code.className = 'out-code';
      code.textContent = part.lines.join('\n');
      outputArea.appendChild(code);
    });

    dlBtn.disabled = false;
    dlBtn.textContent = `↓ ALL ${loaderParts.length} PARTS`;
    statPill.innerHTML = `${deviceKey} · ${loaderParts.length} PARTS · ${fileBytes.length} BYTES · &${hex(startAddr)}–&${hex(endAddr)}`;
  }
}

// Port-config + carve-out blocks are unaffected by split (both are sized
// against the TOTAL binary, not any one part), so they're shared between
// the split and non-split render paths.
function appendSharedBlocks(deviceKey, startAddr, eolName, termByte) {
  const portText = portConfigText(deviceKey, eolName, termByte);
  if (portText) {
    const hdr2 = document.createElement('div');
    hdr2.className = 'out-block-header orange';
    hdr2.textContent = '; SERIAL PORT CONFIG';
    outputArea.appendChild(hdr2);
    const code2 = document.createElement('div');
    code2.className = 'out-code dim';
    code2.textContent = portText;
    outputArea.appendChild(code2);
  }

  const hdr3 = document.createElement('div');
  hdr3.className = 'out-block-header green';
  hdr3.textContent = '; CARVE-OUT — PROTECT MEMORY FROM BASIC';
  outputArea.appendChild(hdr3);
  const code3 = document.createElement('div');
  code3.className = 'out-code dim';
  code3.textContent = carveOutText(deviceKey, startAddr, fileBytes.length);
  outputArea.appendChild(code3);
}

// ── ZIP (store/no-compression) ──────────────────────────────────────────
// Bundling all parts into one .zip lets "download all parts" trigger a
// single browser download. Firing several separate downloads in a row (even
// staggered with setTimeout) gets silently blocked after the first one by
// Chrome/Firefox's automatic-download protection, since only the very first
// call is still tied to the click's user gesture.
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// entries: [{ name: string, data: Uint8Array }]
function createZip(entries) {
  const encoder = new TextEncoder();
  const localChunks = [];
  const centralChunks = [];
  let offset = 0;

  for (const entry of entries) {
    const nameBytes = encoder.encode(entry.name);
    const data = entry.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new DataView(new ArrayBuffer(30));
    localHeader.setUint32(0, 0x04034b50, true);
    localHeader.setUint16(4, 20, true);
    localHeader.setUint16(6, 0, true);
    localHeader.setUint16(8, 0, true);
    localHeader.setUint16(10, 0, true);
    localHeader.setUint16(12, 0x21, true);
    localHeader.setUint32(14, crc, true);
    localHeader.setUint32(18, size, true);
    localHeader.setUint32(22, size, true);
    localHeader.setUint16(26, nameBytes.length, true);
    localHeader.setUint16(28, 0, true);
    const localHeaderBytes = new Uint8Array(localHeader.buffer);

    localChunks.push(localHeaderBytes, nameBytes, data);

    const centralHeader = new DataView(new ArrayBuffer(46));
    centralHeader.setUint32(0, 0x02014b50, true);
    centralHeader.setUint16(4, 20, true);
    centralHeader.setUint16(6, 20, true);
    centralHeader.setUint16(8, 0, true);
    centralHeader.setUint16(10, 0, true);
    centralHeader.setUint16(12, 0, true);
    centralHeader.setUint16(14, 0x21, true);
    centralHeader.setUint32(16, crc, true);
    centralHeader.setUint32(20, size, true);
    centralHeader.setUint32(24, size, true);
    centralHeader.setUint16(28, nameBytes.length, true);
    centralHeader.setUint16(30, 0, true);
    centralHeader.setUint16(32, 0, true);
    centralHeader.setUint16(34, 0, true);
    centralHeader.setUint16(36, 0, true);
    centralHeader.setUint32(38, 0, true);
    centralHeader.setUint32(42, offset, true);
    const centralHeaderBytes = new Uint8Array(centralHeader.buffer);

    centralChunks.push(centralHeaderBytes, nameBytes);

    offset += localHeaderBytes.length + nameBytes.length + data.length;
  }

  const centralOffset = offset;
  const centralSize = centralChunks.reduce((n, c) => n + c.length, 0);

  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(4, 0, true);
  eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, centralOffset, true);
  eocd.setUint16(20, 0, true);

  const allChunks = [...localChunks, ...centralChunks, new Uint8Array(eocd.buffer)];
  const totalLen = allChunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(totalLen);
  let off = 0;
  for (const c of allChunks) { out.set(c, off); off += c.length; }
  return out;
}

// ── Download ─────────────────────────────────────────────────────────────
function downloadLoader() {
  if (loaderParts) {
    const entries = loaderParts.map((part) => ({
      name: `${fileBaseName}_part${part.partNum}of${part.numParts}.txt`,
      data: part.bytes,
    }));
    const zipBytes = createZip(entries);
    const blob = new Blob([zipBytes], { type: 'application/zip' });
    triggerDownload(blob, `${fileBaseName}_parts.zip`);
    return;
  }
  if (!generatedBytes) return;
  const blob = new Blob([generatedBytes], { type: 'application/octet-stream' });
  triggerDownload(blob, fileBaseName + '.txt');
}
function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Splitter ─────────────────────────────────────────────────────────────
function initSplitter() {
  const splitter = document.getElementById('splitter');
  const workspace = document.getElementById('workspace');
  const paneL = document.getElementById('pane-left');
  let dragging = false, startX = 0, startW = 0;
  splitter.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = paneL.offsetWidth;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const totalW = workspace.offsetWidth;
    const newW = Math.min(Math.max(startW + (e.clientX - startX), 200), totalW - 200);
    paneL.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ── Init ─────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  onDeviceChange();
  updateMemcheckUI();
  updateCompressUI();
  initSplitter();
});
</script>
